<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom Web Development Services Melbourne | SLASHKODE</title>
    <meta
      name="description"
      content="High-performance custom web development services in Melbourne. Fast, scalable, GSAP-animated, and SEO-optimized websites that convert visitors into loyal clients."
    />

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      /* SLASHKODE BRAND DESIGN TOKENS */
      :root {
        --sk-color-primary-dark: #1e293b;
        --sk-color-primary-soft: #2c3e50;
        --sk-color-sage: #4a7c59;
        --sk-color-sage-light: #ebf2ec;
        --sk-color-terracotta: #e07a5f;
        --sk-color-terracotta-hover: #d0694e;
        --sk-color-bg-warm: #f8f6f0;
        --sk-color-bg-card: #ffffff;
        --sk-color-surface-sand: #e5e0d8;

        --sk-font-heading: "Plus Jakarta Sans", sans-serif;
        --sk-font-body: "Inter", sans-serif;
        --sk-font-mono: "JetBrains Mono", monospace;

        --sk-radius-sm: 8px;
        --sk-radius-md: 16px;
        --sk-radius-lg: 24px;
        --sk-radius-pill: 9999px;
        --sk-shadow-soft: 0 20px 40px -12px rgba(30, 41, 59, 0.08);
        --sk-shadow-card: 0 4px 20px rgba(0, 0, 0, 0.03);
        --sk-transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
        font-size: 16px;
      }
      body {
        font-family: var(--sk-font-body);
        background-color: var(--sk-color-bg-warm);
        color: var(--sk-color-primary-dark);
        line-height: 1.65;
        overflow-x: hidden;
      }

      .sk-container {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 1.5rem;
      }
      h1,
      h2,
      h3 {
        font-family: var(--sk-font-heading);
        color: var(--sk-color-primary-dark);
        letter-spacing: -0.02em;
        line-height: 1.2;
      }

      .sk-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: var(--sk-color-sage-light);
        color: var(--sk-color-sage);
        font-family: var(--sk-font-mono);
        font-size: 0.8rem;
        font-weight: 500;
        padding: 0.4rem 0.9rem;
        border-radius: var(--sk-radius-pill);
        text-transform: uppercase;
        margin-bottom: 1rem;
      }
      .sk-btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        background: var(--sk-color-terracotta);
        color: #fff;
        font-weight: 600;
        padding: 0.875rem 1.8rem;
        border-radius: var(--sk-radius-pill);
        border: none;
        cursor: pointer;
        transition: var(--sk-transition-smooth);
        text-decoration: none;
      }
      .sk-btn-primary:hover {
        background: var(--sk-color-terracotta-hover);
        transform: translateY(-2px);
      }
      .sk-btn-secondary {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        background: transparent;
        color: var(--sk-color-primary-dark);
        font-weight: 600;
        padding: 0.875rem 1.8rem;
        border-radius: var(--sk-radius-pill);
        border: 1.5px solid var(--sk-color-surface-sand);
        transition: var(--sk-transition-smooth);
        text-decoration: none;
      }
      .sk-btn-secondary:hover {
        background: #fff;
      }

      /* STACKED SERVICE CARDS (GSAP) */
      .services-stacked-section {
        padding: 4rem 0 6rem;
      }
      .service-list {
        display: flex;
        flex-direction: column;
        gap: 2rem;
        max-width: 1050px;
        margin: 0 auto;
      }
      .service-list-item {
        position: sticky;
        top: 10vh;
      }
      .service-card-content {
        background: var(--sk-color-bg-card);
        border: 1px solid var(--sk-color-surface-sand);
        border-radius: var(--sk-radius-lg);
        padding: 3rem;
        box-shadow: var(--sk-shadow-soft);
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2.5rem;
        align-items: center;
        transform-origin: center top;
        will-change: transform, opacity, filter;
      }
    </style>
  </head>
  <body>
    <!-- Navigation -->
    <header
      style="
        padding: 1.5rem 0;
        position: sticky;
        top: 0;
        background: rgba(248, 246, 240, 0.9);
        backdrop-filter: blur(10px);
        z-index: 100;
      "
    >
      <div
        class="sk-container"
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
        "
      >
        <a
          href="/"
          style="
            font-family: var(--sk-font-heading);
            font-weight: 900;
            font-size: 1.5rem;
            text-decoration: none;
            color: var(--sk-color-primary-dark);
          "
          >SLASH<span style="color: var(--sk-color-terracotta)">KODE</span></a
        >
        <nav
          style="
            display: flex;
            gap: 2rem;
            align-items: center;
            font-weight: 500;
          "
        >
          <a href="/work/" style="text-decoration: none">Work</a>
          <a
            href="/services/"
            style="text-decoration: none; color: var(--sk-color-terracotta)"
            >Services</a
          >
          <a href="/pricing/" style="text-decoration: none">Pricing</a>
          <a href="/about/" style="text-decoration: none">About</a>
          <a
            href="#consultation-form"
            class="sk-btn-primary"
            style="padding: 0.6rem 1.2rem; font-size: 0.875rem"
            >Book Call</a
          >
        </nav>
      </div>
    </header>

    <!-- GSAP & ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script>
      gsap.registerPlugin(ScrollTrigger);

      function initServiceBlur() {
        const items = gsap.utils.toArray(".service-list-item");
        if (!items.length) return;

        items.forEach((item, i) => {
          if (i === items.length - 1) return;
          const nextItem = items[i + 1];
          const cardContent =
            item.querySelector(".service-card-content") || item;

          gsap.to(cardContent, {
            scale: 0.92,
            opacity: 0.55,
            filter: "blur(1.5px)",
            ease: "none",
            scrollTrigger: {
              trigger: nextItem,
              start: "top 80%",
              end: "top 10vh",
              scrub: true,
              invalidateOnRefresh: true,
            },
          });
        });
      }

      document.addEventListener("DOMContentLoaded", () => {
        requestAnimationFrame(initServiceBlur);
      });
    </script>
  </body>
</html>
