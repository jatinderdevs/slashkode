<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CTA Section</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --sk-color-primary-dark: #1e293b;
        --sk-color-primary-soft: #2c3e50;
        --sk-color-sage: #4a7c59;
        --sk-color-sage-light: #ebf2ec;
        --sk-color-terracotta: #f74123;
        --sk-color-terracotta-hover: #f76d23;
        --sk-color-bg-warm: #f8f6f0;
        --sk-color-bg-card: #ffffff;
        --sk-color-surface-sand: #e5e0d8;
        --sk-color-black: #0a0a0a;

        --sk-font-heading:
          "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
        --sk-font-body: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        --sk-font-mono: "JetBrains Mono", monospace;

        --sk-text-body: 1rem;
        --sk-text-sm: 0.875rem;
        --sk-text-xs: 0.75rem;

        --sk-radius-md: 16px;
        --sk-radius-lg: 24px;
        --sk-radius-pill: 9999px;

        --sk-transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--sk-color-bg-warm);
        color: var(--sk-color-primary-dark);
        font-family: var(--sk-font-body);
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }

      .spacer {
        height: 32vh;
        display: grid;
        place-items: center;
        font-family: var(--sk-font-mono);
        font-size: var(--sk-text-xs);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--sk-color-primary-soft);
      }

      /* ── CTA Section ── */
      .cta-section {
        background: var(--sk-color-black);
        color: #fff;
        padding: clamp(5.5rem, 12vw, 8.5rem) 0;
        position: relative;
        overflow: hidden;
      }

      /* soft ambient glow */
      .cta-section::before {
        content: "";
        position: absolute;
        top: -20%;
        left: 50%;
        transform: translateX(-50%);
        width: min(680px, 90vw);
        height: 420px;
        background: radial-gradient(
          ellipse at center,
          rgba(247, 65, 35, 0.14) 0%,
          rgba(247, 65, 35, 0.04) 45%,
          transparent 70%
        );
        pointer-events: none;
      }

      .cta-container {
        width: 100%;
        max-width: 820px;
        margin: 0 auto;
        padding: 0 1.5rem;
        text-align: center;
        position: relative;
        z-index: 1;
      }

      .cta-label {
        display: inline-block;
        font-family: var(--sk-font-mono);
        font-size: var(--sk-text-xs);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.4);
        margin-bottom: 1.75rem;
        opacity: 0;
      }

      /* Heading – line mask structure */
      .cta-heading {
        font-family: var(--sk-font-heading);
        font-size: clamp(2.35rem, 6.5vw, 3.75rem);
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 1.15;
        margin-bottom: 1.5rem;
      }

      .cta-line {
        display: block;
        overflow: hidden;
      }

      .cta-line-inner {
        display: block;
        transform: translateY(110%);
        will-change: transform;
      }

      .cta-desc {
        font-size: clamp(1rem, 2.2vw, 1.125rem);
        color: rgba(255, 255, 255, 0.55);
        line-height: 1.65;
        max-width: 38ch;
        margin: 0 auto 2.75rem;
        opacity: 0;
      }

      .cta-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        opacity: 0;
      }

      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.55rem;
        padding: 1rem 1.85rem;
        background: var(--sk-color-terracotta);
        color: #fff;
        border-radius: var(--sk-radius-pill);
        font-family: var(--sk-font-body);
        font-weight: 600;
        font-size: var(--sk-text-sm);
        text-decoration: none;
        border: none;
        cursor: pointer;
        transition: var(--sk-transition-smooth);
      }

      .btn-primary:hover {
        background: var(--sk-color-terracotta-hover);
        transform: translateY(-2px);
      }

      .btn-primary svg {
        width: 16px;
        height: 16px;
        transition: transform 0.25s ease;
      }

      .btn-primary:hover svg {
        transform: translateX(3px);
      }

      .btn-secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 1rem 1.65rem;
        background: transparent;
        color: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: var(--sk-radius-pill);
        font-family: var(--sk-font-body);
        font-weight: 500;
        font-size: var(--sk-text-sm);
        text-decoration: none;
        transition: var(--sk-transition-smooth);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.06);
        border-color: rgba(255, 255, 255, 0.3);
        color: #fff;
      }

      .cta-note {
        margin-top: 1.75rem;
        font-family: var(--sk-font-mono);
        font-size: 0.7rem;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.28);
        opacity: 0;
      }

      /* ── Responsive ── */
      @media (max-width: 540px) {
        .cta-actions {
          flex-direction: column;
          width: 100%;
        }

        .btn-primary,
        .btn-secondary {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="spacer">Scroll down → CTA</div>

    <section class="cta-section" aria-label="Get a quote">
      <div class="cta-container">
        <span class="cta-label" data-label>Let’s work together</span>

        <h2 class="cta-heading">
          <span class="cta-line">
            <span class="cta-line-inner">Have a project</span>
          </span>
          <span class="cta-line">
            <span class="cta-line-inner">in mind?</span>
          </span>
        </h2>

        <p class="cta-desc" data-desc>
          Tell me a little about what you need. I’ll come back with a clear
          quote, timeline, and next steps — no pressure.
        </p>

        <div class="cta-actions" data-actions>
          <a href="/contact" class="btn-primary">
            Get a Quote
            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path
                d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
              />
            </svg>
          </a>
          <a href="/contact" class="btn-secondary">Say hello</a>
        </div>

        <p class="cta-note" data-note>Usually replies within 1 business day</p>
      </div>
    </section>

    <div class="spacer">End of section</div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

    <script>
      gsap.registerPlugin(ScrollTrigger);

      const label = document.querySelector("[data-label]");
      const lines = gsap.utils.toArray(".cta-line-inner");
      const desc = document.querySelector("[data-desc]");
      const actions = document.querySelector("[data-actions]");
      const note = document.querySelector("[data-note]");

      // initial state
      gsap.set(lines, { y: "110%" });
      gsap.set([label, desc, actions, note], { opacity: 0, y: 14 });

      // Play once when the section is in view — slow, easy reveal (not scrubbed)
      const tl = gsap.timeline({
        scrollTrigger: {
          trigger: ".cta-section",
          start: "top 72%",
          once: true,
        },
      });

      // label
      tl.to(
        label,
        {
          opacity: 1,
          y: 0,
          duration: 0.55,
          ease: "power2.out",
        },
        0.1,
      );

      // heading lines — slow + staggered
      tl.to(
        lines,
        {
          y: "0%",
          duration: 1.05,
          stagger: 0.18,
          ease: "power3.out",
        },
        0.28,
      );

      // description
      tl.to(
        desc,
        {
          opacity: 1,
          y: 0,
          duration: 0.7,
          ease: "power2.out",
        },
        "-=0.35",
      );

      // buttons
      tl.to(
        actions,
        {
          opacity: 1,
          y: 0,
          duration: 0.65,
          ease: "power2.out",
        },
        "-=0.3",
      );

      // note
      tl.to(
        note,
        {
          opacity: 1,
          y: 0,
          duration: 0.5,
          ease: "power2.out",
        },
        "-=0.2",
      );
    </script>
  </body>
</html>
